<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CODE BY "RAJU_ THE_CODER"</title>
    <link rel="stylesheet" href="age.css">
   
</head>
<body>
    <div class="block">
    <h1>Age Calculater</h1>
    <label for="birthdate">Enter Your Birthdate :</label> <br> <br>
    <input type="date" id="birthdate" /><br><br>
    <button onclick="CalculateAge()">Calculate Age</button>
    <p id="result"></p>
    </div>

    <script>
        function CalculateAge() {
            const birthdate = document.getElementById("birthdate").value;
            const resultElement  = document.getElementById("result");

            if(birthdate) {
                const today = new Date();
                const birthDate = new Date(birthdate);


                let ageYears = today.getFullYear() - birthDate.getFullYear();
                let ageMonths = today.getMonth() - birthDate.getMonth();
                let ageDays = today.getDay() - birthDate.getDate();


                if ( ageDays < 0) {
                    ageMonths--;
                    ageDays += new Date(
                        today.getFullYear(),
                        today.getMonth(),
                        0
                    ).getDate();

                    
                }
                if(ageMonths<0){
                    ageYears--;
                    ageMonths += 12;
                }
                resultElement.innerText = `Your Age is ${ageYears} years, ${ageMonths} months, and ${ageDays} days.`;
                resultElement.style.color = "white";
            }
            else {
                resultElement.innerText = "Pleas Enter Your Birthdate";
                resultElement.style.color = "red";
            }
        }
    </script>
</body>
</html>
